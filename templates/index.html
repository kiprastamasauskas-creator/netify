<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netify - Home</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
      <div class="logo-container">
        <img src="/static/netify2.png" alt="WAI-FI Logo" class="nav-logo">
      </div>
      <nav>
        <a href="{{ url_for('home') }}" class="nav-btn active">HOME</a>
        <a href="{{ url_for('register') }}" class="nav-btn">CREATE ACCOUNT</a>
        <a href="{{ url_for('login') }}" class="nav-btn">LOG IN</a>
      </nav>
    </header>

    <!-- Main Content Container -->
    <main class="content-container">
        <section class="tab-content active">
            <!-- 1. Top Hero Section -->
            <div class="top-hero">
                <div class="hero-text">
                    <h1>Welcome to Netify</h1>
                    <p>Your trusted internet service provider.</p>
                    <a href="{{ url_for('register') }}" class="cta-btn" style="text-decoration: none; display: inline-block; text-align: center;">Discover Our Services</a>
                </div>
                <div class="hero-image">
                    <img src="/static/router.jpg" alt="Technician configuring internet router">
                </div>
            </div>

            <!-- 2. Secondary Split Section -->
            <div class="hero-split">
                <div class="hero-image">
                    <img src="/static/happyman.jpg" alt="Happy man using smartphone">
                </div>
                <div class="hero-text">
                    <h2>We provide fast, affordable<br>and secure internet services<br>for your home or business.</h2>
                    <a href="{{ url_for('register') }}" class="cta-btn" style="text-decoration: none; display: inline-block; text-align: center;">Explore Our Products</a>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
